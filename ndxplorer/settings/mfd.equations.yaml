- Sg/Sr:
    d['Green Count Rate (KHz)'] / d['Red Count Rate (KHz)']
- Proximity ratio:
    d['Red Count Rate (KHz)'] / (d['Green Count Rate (KHz)'] + d['Red Count Rate (KHz)'])
- Fg:
    d['Green Count Rate (KHz)'] - c['Bg']
- Fr:
    d['Red Count Rate (KHz)'] - c['Br'] - c['alpha'] * d['Green Count Rate (KHz)']
- Fg/Fr:
    d['Fg'] / d['Fr']
- Fd/Fa:
    d['Fg/Fr'] / c['gG/gR']
- FRET efficiency:
    (1.+d['Fd/Fa']*c['PhiA']/c['PhiD'])**(-1.0)
- Fg(PIE):
    d['S prompt green (kHz)'] - c['Bg']
- Fr(PIE):
    d['S prompt red (kHz)'] - c['Br'] - c['alpha'] * d['S prompt green (kHz)']
- Fy(PIE):
    d['S delayed yellow (kHz)']
- Fg/Fr(PIE):
    d['Fg(PIE)'] / d['Fr(PIE)']
- Sg/Sr(PIE):
    d['S prompt green (kHz)'] / d['S prompt red (kHz)']
- Fd/Fa(PIE):
    d['Fg/Fr(PIE)'] / c['gG/gR']
- Proximity ratio (PIE):
    d['S prompt red (kHz)'] / (d['S prompt red (kHz)'] + d['S prompt green (kHz)'])
- FRET efficiency (PIE):
    (1.+d['Fd/Fa(PIE)']*c['PhiA']/c['PhiD'])**(-1.0)
- Sapp (PIE):
    (d['Fr(PIE)'] + d['Fg(PIE)']) / (d['Fr(PIE)'] + d['Fy(PIE)'] + d['Fg(PIE)'])
- Stoichiometry (PIE):
    (d['Fr(PIE)'] - c['beta'] * d['Fy(PIE)'] - c['alpha'] * d['Fg(PIE)'] + (1/c['gG/gR']) * (c['PhiA']/c['PhiD']) * d['Fg(PIE)']) / (d['Fr(PIE)'] - c['beta'] * d['Fy(PIE)'] - c['alpha'] * d['Fg(PIE)'] + (1/c['gG/gR']) * (c['PhiA']/c['PhiD']) * d['Fg(PIE)'] + c['r'] * d['Fy(PIE)'])
- Tg-Tr (ms):
    d['Duration (green) (ms)'] - d['Duration (red) (ms)']
- <tauD(A)>x:
    (1-d['FRET efficiency'])*c['tauD0x']
- Var_tauD(A)):
    d['Tau (green)']*d['<tauD(A)>x'] - d['<tauD(A)>x']**(2.0)
- Total count rate green + red:
    d['Green Count Rate (KHz)'] + d['Red Count Rate (KHz)']
- 1/Sensitivity:
    1./(1.-d['FRET efficiency']*(1.-(c['gG/gR']*c['PhiD']/c['PhiA'])))
