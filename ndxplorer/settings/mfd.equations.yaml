- Sg: >-
    'Green Count Rate (KHz)'
- Sr: >-
    'Red Count Rate (KHz)'
- Sg/Sr: >-
    'Sg' / 'Sr'
- Proximity ratio: >-
    'Sr' / ('Sg' + 'Sr')
- Fg: >-
    'Sg' - 'Bg'
- Fr: >-
    'Sr' - 'Br' - 'alpha' * 'Sg'
- Fg/Fr: >-
    'Fg' / 'Fr'
- Fd/Fa: >-
    'Fg/Fr' / 'gG/gR'
- FRET efficiency: >-
    (1.+ 'Fd/Fa' * 'PhiA' / 'PhiD')**(-1.0)
- R_FRET: >-
    'forster_radius' * (1. / 'FRET efficiency' - 1.)**(1./6.)
- Sg(PIE): >-
    'S prompt green (kHz)'
- Fg(PIE): >-
    'Sg(PIE)' - 'Bg'
- Sr(PIE): >-
    'S prompt red (kHz)'
- Fr(PIE): >-
    'Sr(PIE)' - 'Br' - 'alpha' * 'Sg(PIE)'
- Sy(PIE): >-
    'S delayed yellow (kHz)'
- Fy(PIE): >-
    'Sy(PIE)' - 'By'
- Fg/Fr(PIE): >-
    'Fg(PIE)' / 'Fr(PIE)'
- Sg/Sr(PIE): >-
    'Sg(PIE)' / 'Sr(PIE)'
- Fd/Fa(PIE): >-
    'Fg/Fr(PIE)' / 'gG/gR'
- Proximity ratio(PIE): >-
    'Sr(PIE)' / ('Sr(PIE)' + 'Sg(PIE)')
- FRET efficiency(PIE): >-
    (1.+ 'Fd/Fa(PIE)' * 'PhiA' / 'PhiD')**(-1.0)
- R_FRET(PIE): >-
    'forster_radius' * (1. / 'FRET efficiency' - 1.)**(1./6.)
- ratioA(PIE): >-
    'Fr(PIE)'/ 'Fy(PIE)'
- FRET efficiency_AA(PIE): >-
    'ratioA(PIE)' / 'r'
- R_FRET,AA(PIE): >-
    'forster_radius' * (1. / 'FRET efficiency_AA(PIE)' - 1.)**(1./6.)
- Sapp(PIE,S): >-
    ('Sr(PIE)' + 'Sg(PIE)') / ('Sr(PIE)' + 'Sy(PIE)' + 'Sg(PIE)')
- Sapp(PIE,F): >-
    ('Fr(PIE)' + 'Fg(PIE)') / ('Fr(PIE)' + 'Fy(PIE)' + 'Fg(PIE)')
- Stoichiometry (PIE): >-
    ('Fr(PIE)' - 'beta' * 'Fy(PIE)' - 'alpha' * 'Fg(PIE)' + (1/'gG/gR') * ('PhiA'/'PhiD') * 'Fg(PIE)') / ('Fr(PIE)' - 'beta' * 'Fy(PIE)' - 'alpha' * 'Fg(PIE)' + (1/'gG/gR') * ('PhiA'/'PhiD') * 'Fg(PIE)' + 'r' * 'Fy(PIE)')
- Tg-Tr(ms): >-
    'Duration (green) (ms)' - 'Duration (red) (ms)'
- <tauD(A)>x: >-
    (1 - 'FRET efficiency') * 'tauD0'
- Var_tauD(A)): >-
    'Tau (green)' * '<tauD(A)>x' - '<tauD(A)>x'**(2.0)
- Total count rate green + red: >-
    'Green Count Rate (KHz)' + 'Red Count Rate (KHz)'
- 1/Sensitivity: >-
    1./(1. - 'FRET efficiency' * (1. - ('gG/gR' * 'PhiD' / 'PhiA')))

# ---- ALEX-identified rates from counts (+ duration) ----
- Sg(ALEX): >-
    'F_Dexc_Dem' / 'Tau' / 1.0e3
- Sr(ALEX): >-
    'F_Dexc_Aem' / 'Tau' / 1.0e3
- Sy(ALEX): >-
    'F_Aexc_Aem' / 'Tau' / 1.0e3  # acceptor-excitation acceptor-emission
- Sx(ALEX): >-
    'F_Aexc_Dem' / 'Tau' / 1.0e3  # acceptor-excitation donor-emission (usually leakage)

# ---- Background / leakage corrected ALEX channels ----
# expects same constants as PIE: Bg, Br, By, alpha, beta, r, gG/gR, PhiA, PhiD
- Fg(ALEX): >-
    'Sg(ALEX)' - 'Bg'
- Fr(ALEX): >-
    'Sr(ALEX)' - 'Br' - 'alpha' * 'Sg(ALEX)'
- Fy(ALEX): >-
    'Sy(ALEX)' - 'By'

# ---- Derived ALEX ratios and efficiencies ----
- Fg/Fr(ALEX): >-
    'Fg(ALEX)' / 'Fr(ALEX)'
- Sg/Sr(ALEX): >-
    'Sg(ALEX)' / 'Sr(ALEX)'
- Fd/Fa(ALEX): >-
    'Fg/Fr(ALEX)' / 'gG/gR'
- Proximity ratio(ALEX): >-
    'Sr(ALEX)' / ('Sr(ALEX)' + 'Sg(ALEX)')
- FRET efficiency(ALEX): >-
    (1. + 'Fd/Fa(ALEX)' * 'PhiA' / 'PhiD')**(-1.0)

# ---- Apparent stoichiometry from signals and from corrected fluxes (ALEX) ----
- Sapp(ALEX,S): >-
    ('Sr(ALEX)' + 'Sg(ALEX)') / ('Sr(ALEX)' + 'Sy(ALEX)' + 'Sg(ALEX)')
- Sapp(ALEX,F): >-
    ('Fr(ALEX)' + 'Fg(ALEX)') / ('Fr(ALEX)' + 'Fy(ALEX)' + 'Fg(ALEX)')

# ---- Full ALEX stoichiometry (same form as PIE, just using ALEX channels) ----
- Stoichiometry (ALEX): >-
    ('Fr(ALEX)' - 'beta' * 'Fy(ALEX)' - 'alpha' * 'Fg(ALEX)' + (1/'gG/gR') * ('PhiA'/'PhiD') * 'Fg(ALEX)') /
    ('Fr(ALEX)' - 'beta' * 'Fy(ALEX)' - 'alpha' * 'Fg(ALEX)' + (1/'gG/gR') * ('PhiA'/'PhiD') * 'Fg(ALEX)' + 'r' * 'Fy(ALEX)')

# ---- Convenience sums (ALEX) ----
- Total count rate (ALEX): >-
    'Sg(ALEX)' + 'Sr(ALEX)'

# ---- FRET factors ----
- Rapp: >-
    (3./2.) / ('kappa2') * 'RDA'
- kFRET: >-
    1/'tauD0'*3/2*'kappa2'*('forster_radius'/'RDA')**(6.0)