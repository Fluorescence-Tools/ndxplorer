- Sg: >-
    'Green Count Rate (KHz)'
- Sr: >-
    'Red Count Rate (KHz)'
- Sg/Sr: >-
    'Sg' / 'Sr'
- Proximity ratio: >-
    'Sr' / ('Sg' + 'Sr')
- Fg: >-
    'Sg' - 'Bg'
- Fr: >-
    'Sr' - 'Br' - 'alpha' * 'Sg'
- Fg/Fr: >-
    'Fg' / 'Fr'
- Fd/Fa: >-
    'Fg/Fr' / 'gG/gR'
- FRET efficiency: >-
    (1.+ 'Fd/Fa' * 'PhiA' / 'PhiD')**(-1.0)
- Sg(PIE): >-
    'S prompt green (kHz)'
- Fg(PIE): >-
    'Sg(PIE)' - 'Bg'
- Sr(PIE): >-
    'S prompt red (kHz)'
- Fr(PIE): >-
    'Sr(PIE)' - 'Br' - 'alpha' * 'Sg(PIE)'
- Sy(PIE): >-
    'S delayed yellow (kHz)'
- Fy(PIE): >-
    'Sy(PIE)' - 'By'
- Fg/Fr(PIE): >-
    'Fg(PIE)' / 'Fr(PIE)'
- Sg/Sr(PIE): >-
    'Sg(PIE)' / 'Sr(PIE)'
- Fd/Fa(PIE): >-
    'Fg/Fr(PIE)' / 'gG/gR'
- Proximity ratio(PIE): >-
    'Sr(PIE)' / ('Sr(PIE)' + 'Sg(PIE)')
- FRET efficiency(PIE): >-
    (1.+ 'Fd/Fa(PIE)' * 'PhiA' / 'PhiD')**(-1.0)
- Sapp(PIE,S): >-
    ('Sr(PIE)' + 'Sg(PIE)') / ('Sr(PIE)' + 'Sy(PIE)' + 'Sg(PIE)')
- Sapp(PIE,F): >-
    ('Fr(PIE)' + 'Fg(PIE)') / ('Fr(PIE)' + 'Fy(PIE)' + 'Fg(PIE)')
- Stoichiometry (PIE): >-
    ('Fr(PIE)' - 'beta' * 'Fy(PIE)' - 'alpha' * 'Fg(PIE)' + (1/'gG/gR') * ('PhiA'/'PhiD') * 'Fg(PIE)') / ('Fr(PIE)' - 'beta' * 'Fy(PIE)' - 'alpha' * 'Fg(PIE)' + (1/'gG/gR') * ('PhiA'/'PhiD') * 'Fg(PIE)' + 'r' * 'Fy(PIE)')
- Tg-Tr(ms): >-
    'Duration (green) (ms)' - 'Duration (red) (ms)'
- <tauD(A)>x: >-
    (1 - 'FRET efficiency') * 'tauD0x'
- Var_tauD(A)): >-
    'Tau (green)' * '<tauD(A)>x' - '<tauD(A)>x'**(2.0)
- Total count rate green + red: >-
    'Green Count Rate (KHz)' + 'Red Count Rate (KHz)'
- 1/Sensitivity: >-
    1./(1. - 'FRET efficiency' * (1. - ('gG/gR' * 'PhiD' / 'PhiA')))
