- name: "Perrin-Equation"
  equation: "r0/(1+x/rho)"
  parameters:
    r0: 0.38
    rho: 1.5
  ranges:
    r0: [0, 0.4]
    rho: [0, 100]

- name: "Perrin 2x rho"
  equation: "r0*(X/(1+(x/rho1))+(1-X)/(1+(x/rho2)))"
  parameters:
    r0: 0.38
    X: 0.5
    rho1: 0.5
    rho2: 10.0
  ranges:
    r0: [0, 0.4]
    X: [0, 1]
    rho1: [0, 100]
    rho2: [0, 100]

- name: "FD/FA vs tau (static line)"
  equation: "x*tauD0*kf/((tauD0-x)*PhiA)"
  parameters:
    tauD0: 4.0
    kf: 0.2
    PhiA: 0.32
  ranges:
    tauD0: [0, 10]
    kf: [0, 100]
    PhiA: [0, 1]

- name: "FD/FA vs tau (dynamic line)"
  equation: "kf/(PhiA*((1/tauDA2+1/tauDA1-x/(tauDA1*tauDA2))-1/tauD0))"
  parameters:
    tauD0: 4.0
    kf: 0.2
    PhiA: 0.32
    tauDA1: 1.0
    tauDA2: 3.0
  ranges:
    tauD0: [0, 10]
    kf: [0, 100]
    PhiA: [0, 1]
    tauDA1: [0, 10]
    tauDA2: [0, 10]

- name: "E vs tau (static line)"
  equation: "1 - x/tauD0"
  parameters:
    tauD0: 4.0
  ranges:
    tauD0: [0, 10]

- name: "kFRET vs RDA"
  equation: "1/tauD0*(R0/x)**(6.0)"
  parameters:
    tauD0: 4.0
    R0: 52.0
  ranges:
    tauD0: [0, 10]
    R0: [1, 100]

- name: "E vs tau (dynamic line)"
  equation: "1-(tauDA1*tauDA2/(tauD0*(tauDA1+tauDA2-x)))"
  parameters:
    tauD0: 4.0
    kf: 0.2
    PhiA: 0.32
    tauDA1: 1.0
    tauDA2: 3.0
  ranges:
    tauD0: [0, 10]
    kf: [0, 100]
    PhiA: [0, 1]
    tauDA1: [0, 10]
    tauDA2: [0, 10]

- name: "Static FRET Line (Gaussian Distribution)"
  function: |
    def static_fret_line(forster_radius=52.0, sigma=6.0, tau_d0=4.0, num_points=500):
        import numpy as np
        from scipy.integrate import simpson

        def fret_efficiency(r, r0):
            return 1.0 / (1.0 + (r / r0)**6)

        def lifetime(e, tau0):
            return tau0 * (1 - e)

        def gaussian_pdf(r, mean, sigma):
            p = np.exp(-0.5 * ((r - mean) / sigma)**2)
            p[r < 0] = 0
            return p
        
        num_points = int(num_points)
        r_values = np.linspace(0.0001 * forster_radius, 3 * forster_radius, 300)
        E_r = fret_efficiency(r_values, forster_radius)
        tau_r = lifetime(E_r, tau_d0)

        mean_distances = np.linspace(r_values[0], r_values[-1], num_points)
        tauf_values = np.zeros_like(mean_distances)
        E_values = np.zeros_like(mean_distances)

        for i, mean_r in enumerate(mean_distances):
            p_r = gaussian_pdf(r_values, mean_r, sigma)
            norm = simpson(p_r, r_values)
            p_r /= norm

            # Average efficiency
            E_values[i] = simpson(p_r * E_r, r_values)

            # Fluorescence-weighted lifetime
            num = simpson(p_r * tau_r**2, r_values)
            denom = simpson(p_r * tau_r, r_values)
            tauf_values[i] = num / denom

        return tauf_values, E_values
  parameters:
    forster_radius: 52.0
    sigma: 6.0
    tau_d0: 4.0
    num_points: 100
  ranges:
    forster_radius: [30.0, 70.0]
    sigma: [1.0, 20.0]
    tau_d0: [1.0, 10.0]
    num_points: [100, 1000]


- name: "Circle"
  function: |
    def circle(radius=1.0, center_x=0.0, center_y=0.0, t_start=0.0, t_end=6.28, num_points=100):
        import numpy as np
        t = np.linspace(t_start, t_end, int(num_points))
        x = center_x + radius * np.cos(t)
        y = center_y + radius * np.sin(t)
        return x, y
  parameters:
    radius: 1.0
    center_x: 0.0
    center_y: 0.0
    t_start: 0.0
    t_end: 6.28
    num_points: 100
  ranges:
    radius: [0.1, 10.0]
    center_x: [-5.0, 5.0]
    center_y: [-5.0, 5.0]
    t_start: [0.0, 6.28]
    t_end: [0.0, 6.28]
    num_points: [10, 1000]
