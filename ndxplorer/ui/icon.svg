<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>ndXplorer icon - 2D histogram with marginal distributions</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dbe9ff"/>
      <stop offset="1" stop-color="#2a6fd4"/>
    </linearGradient>
    <style>
      .axis{stroke:#1b1e23;stroke-width:2;stroke-linecap:round}
      .frame{fill:#ffffff;stroke:#1b1e23;stroke-width:2}
      .bin{stroke:none}
      .marg{fill:#7f8c8d;stroke:none}
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="128" height="128" fill="#ffffff"/>

  <!-- Plot frame -->
  <!-- margins: left 18, top 8, bottom 18, right 24 -->
  <rect x="18" y="20" width="80" height="80" class="frame"/>

  <!-- 5x5 heatmap bins inside 80x80 area -->
  <!-- cell size = 16 -->
  <g id="heatmap">
    <!-- row 0 (top) -->
    <rect x="18" y="20" width="16" height="16" class="bin" fill="#dbe9ff"/>
    <rect x="34" y="20" width="16" height="16" class="bin" fill="#b7d1ff"/>
    <rect x="50" y="20" width="16" height="16" class="bin" fill="#93baff"/>
    <rect x="66" y="20" width="16" height="16" class="bin" fill="#6ea1f2"/>
    <rect x="82" y="20" width="16" height="16" class="bin" fill="#4b86e0"/>

    <!-- row 1 -->
    <rect x="18" y="36" width="16" height="16" class="bin" fill="#c9dcff"/>
    <rect x="34" y="36" width="16" height="16" class="bin" fill="#9fc0ff"/>
    <rect x="50" y="36" width="16" height="16" class="bin" fill="#7aa9f7"/>
    <rect x="66" y="36" width="16" height="16" class="bin" fill="#558fe6"/>
    <rect x="82" y="36" width="16" height="16" class="bin" fill="#3a78d6"/>

    <!-- row 2 -->
    <rect x="18" y="52" width="16" height="16" class="bin" fill="#b7d1ff"/>
    <rect x="34" y="52" width="16" height="16" class="bin" fill="#8fb6ff"/>
    <rect x="50" y="52" width="16" height="16" class="bin" fill="#6a9eee"/>
    <rect x="66" y="52" width="16" height="16" class="bin" fill="#4f87df"/>
    <rect x="82" y="52" width="16" height="16" class="bin" fill="#2f6dcb"/>

    <!-- row 3 -->
    <rect x="18" y="68" width="16" height="16" class="bin" fill="#a4c5ff"/>
    <rect x="34" y="68" width="16" height="16" class="bin" fill="#7eaefe"/>
    <rect x="50" y="68" width="16" height="16" class="bin" fill="#5a98ef"/>
    <rect x="66" y="68" width="16" height="16" class="bin" fill="#3e81df"/>
    <rect x="82" y="68" width="16" height="16" class="bin" fill="#2a6fd4"/>

    <!-- row 4 (bottom) -->
    <rect x="18" y="84" width="16" height="16" class="bin" fill="#93baff"/>
    <rect x="34" y="84" width="16" height="16" class="bin" fill="#6ea1f2"/>
    <rect x="50" y="84" width="16" height="16" class="bin" fill="#4b86e0"/>
    <rect x="66" y="84" width="16" height="16" class="bin" fill="#2f6dcb"/>
    <rect x="82" y="84" width="16" height="16" class="bin" fill="#1f57b2"/>
  </g>

  <!-- Top marginal bars (above the plot area) -->
  <g id="marginal-top">
    <rect x="18" y="10" width="16" height="8" class="marg" opacity="0.45"/>
    <rect x="34" y="8"  width="16" height="10" class="marg" opacity="0.55"/>
    <rect x="50" y="6"  width="16" height="12" class="marg" opacity="0.7"/>
    <rect x="66" y="8"  width="16" height="10" class="marg" opacity="0.55"/>
    <rect x="82" y="12" width="16" height="6"  class="marg" opacity="0.4"/>
  </g>

  <!-- Right marginal bars (to the right of plot area) -->
  <g id="marginal-right">
    <rect x="100" y="84" width="20" height="16" class="marg" opacity="0.45"/>
    <rect x="100" y="68" width="22" height="16" class="marg" opacity="0.55"/>
    <rect x="100" y="52" width="26" height="16" class="marg" opacity="0.7"/>
    <rect x="100" y="36" width="22" height="16" class="marg" opacity="0.55"/>
    <rect x="100" y="20" width="18" height="16" class="marg" opacity="0.4"/>
  </g>

  <!-- Axes ticks (minimal) -->
  <line x1="18" y1="100" x2="98" y2="100" class="axis"/>
  <line x1="18" y1="20" x2="18" y2="100" class="axis"/>
</svg>