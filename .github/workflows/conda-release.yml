
name: Build and Upload Conda Packages

on:
  workflow_dispatch:
  release:
    types: ['released', 'prereleased']
  schedule:
    # At 11:00 AM, every 3 months
    - cron: "0 11 * */3 *"

jobs:
  build:
    name: CondaBuild (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: "Set SDK on MacOS (if needed)"
        if: startsWith(matrix.os, 'macos')
        run: tools/install_macos_sdk.sh

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          mamba-version: "*"
          channels: conda-forge,bioconda,tpeulen
          channel-priority: true

      - name: Display Conda Settings
        shell: bash -el {0}
        if: runner.os != 'Windows'
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
          printenv | sort

      - name: Display Conda Settings (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
          Get-ChildItem env: | Sort-Object Name

      - name: Build and Upload Conda Package
        if: runner.os != 'Windows'
        uses: aganders3/headless-gui@v2
        with:
          shell: bash -el {0}
          run: |
            mamba install conda-build boa anaconda-client
            cd conda-recipe
            conda mambabuild . --output-folder conda-bld -c tpeulen
            anaconda -t ${{ secrets.ANACONDA_TOKEN }} upload -u tpeulen --force conda-bld/**/*.tar.bz2

      - name: Build and Upload Conda Package (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          mamba install conda-build boa anaconda-client
          cd conda-recipe
          conda mambabuild . --output-folder conda-bld -c tpeulen
          anaconda -t ${{ secrets.ANACONDA_TOKEN }} upload -u tpeulen --force conda-bld/**/*.tar.bz2
